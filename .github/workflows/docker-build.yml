name: Build and Push Docker Image

on:
  push:
    branches:
      - gift95          # 推送到 gift95 分支时触发
    tags:
      - 'v*'            # 推送 tag 时触发（仍会打 latest，但你可以选择是否保留）
  pull_request:
    branches:
      - gift95          # 建议改为 gift95，因为默认分支已经是 gift95
  #schedule:
  #  - cron: '0 0 * * 0' # 每周日自动构建（默认在 gift95 分支运行）
  workflow_dispatch:    # 手动触发（默认在 gift95 分支运行）

env:
  REGISTRY: docker.io
  IMAGE_NAME: gift95/rustscan

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 只生成 latest 标签（因为默认分支是 gift95，该标签指向 gift95 的构建）
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
